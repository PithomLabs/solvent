version: '3'

vars:
  CONFIG: scripts/demo/config.env

tasks:
  setup:
    desc: Start pinned CockroachDB in Docker, initialize schema, build binaries
    cmds:
      - bash scripts/demo/setup.sh

  db:up:
    desc: Start the CockroachDB container
    cmds:
      - docker start solvent-crdb 2>/dev/null || echo "Container not found; run 'task setup' first"

  db:down:
    desc: Stop the CockroachDB container
    cmds:
      - docker stop solvent-crdb 2>/dev/null || true

  db:reset:
    desc: Drop and recreate the fable database, reapply schema
    cmds:
      - echo "Resetting database 'fable' on solvent-crdb (DROP DATABASE IF EXISTS fable CASCADE)..."
      - docker exec solvent-crdb cockroach sql --insecure -e "DROP DATABASE IF EXISTS fable CASCADE; CREATE DATABASE fable;"
      - docker exec -i solvent-crdb cockroach sql --insecure --database=fable < db/001_schema.sql
      - docker exec -i solvent-crdb cockroach sql --insecure --database=fable < db/002_corpus.sql
      - docker exec -i solvent-crdb cockroach sql --insecure --database=fable < db/003_wizard.sql
      - docker exec -i solvent-crdb cockroach sql --insecure --database=fable < db/004_debt_vocabulary.sql
      - echo "Database reset complete."

  demo:track1:
    desc: Run the Track 1 vulnerability disclosure demo
    cmds:
      - bash scripts/demo/track1.sh

  demo:replay:
    desc: Prove deterministic replay creates no duplicates
    cmds:
      - bash scripts/demo/replay.sh

  demo:track2:
    desc: Run the Track 2 historical retraction demo
    cmds:
      - bash scripts/demo/track2.sh

  inspect:
    desc: Show a human-readable snapshot of the current ledger
    cmds:
      - bash scripts/demo/inspect.sh

  demo:film:
    desc: Filmable walkthrough (interactive pacing)
    deps: [db:up]
    cmds:
      - bash scripts/demo/walkthrough.sh

  demo:film:auto:
    desc: Filmable walkthrough (auto pacing, 6s per beat)
    deps: [db:up]
    cmds:
      - bash scripts/demo/walkthrough.sh --auto 6

  mcp:build:
    desc: Build the MCP server binary
    cmds:
      - go build -o bin/solvent-mcp ./cmd/solvent-mcp

  mcp:seed:
    desc: Seed the Track 2 baseline belief for MCP demo
    dotenv:
      - scripts/demo/config.env
    cmds:
      - task db:reset
      - >
        go run ./cmd/operator-review --dsn "$SOLVENT_DSN"
        --scenario 00000000-0000-0000-0000-000000000002
        --enter-claim "etcd v3.5.0 is approved for production deployment (decision as of 2021-06-16)"
        --claim-type postulated
        --evidence-url "https://github.com/etcd-io/etcd/releases/tag/v3.5.0"
        --evidence-sha f47656dfaad45b2ecdb32c3169b8897b153d7a8b2453ba8e7c34a2dcde609ce1
      - echo "Seed complete. Post-seed state - 1 belief (postulated, entered, 6 debts), 1 evidence, 0 intents, audit 0."

  mcp:seed:promoted:
    desc: Seed the Stage 2 promoted-state variant into track1 for the real-agent experiment
    dotenv:
      - scripts/demo/config.env
    cmds:
      - task db:reset
      - |
        set -euo pipefail
        OUT=$(go run ./cmd/operator-review --dsn "$SOLVENT_DSN" \
          --scenario "$SOLVENT_SCENARIO_1" \
          --enter-claim "etcd v3.5.0 is approved for production deployment (decision as of 2021-06-16)" \
          --claim-type postulated \
          --evidence-url "https://github.com/etcd-io/etcd/releases/tag/v3.5.0" \
          --evidence-sha f47656dfaad45b2ecdb32c3169b8897b153d7a8b2453ba8e7c34a2dcde609ce1)
        echo "$OUT"
        BELIEF_ID=$(echo "$OUT" | sed -n 's/^BELIEF_ID=//p')
        [ -n "$BELIEF_ID" ] || { echo "FAIL: no BELIEF_ID from entry mode"; exit 1; }
        go run ./cmd/operator-review --dsn "$SOLVENT_DSN" \
          --scenario "$SOLVENT_SCENARIO_1" --belief "$BELIEF_ID" \
          --action "deploy etcd v3.5.0" \
          --debt needProvenanceCheck --debt needContradictionSweep --debt needBlastRadius \
          --debt needRollbackPlan --debt needVersionPin --debt needOperatorSignoff
      - 'echo "Promoted seed complete - track1 has 1 promoted debt-free belief with 1 live intent, audit 0."'

  agent:workspace:
    desc: Create the isolated agent workspace for the Stage 1 real-agent demo
    vars:
      WORKSPACE: '{{.WORKSPACE | default "$HOME/.solvent-agent-box"}}'
    cmds:
      - mkdir -p {{.WORKSPACE}}
      - |
        cat > {{.WORKSPACE}}/solvent-mcp.json <<JSON
        {
          "mcpServers": {
            "solvent": {
              "command": "{{.ROOT_DIR}}/bin/solvent-mcp",
              "args": [],
              "env": {
                "FABLE_DSN": "postgresql://root@localhost:26260/fable?sslmode=disable",
                "SOLVENT_FIXTURE_ROOT": "{{.ROOT_DIR}}/internal/derive/testdata/etcd_real"
              }
            }
          }
        }
        JSON
      - |
        cat > {{.WORKSPACE}}/prompt.txt <<'TXT'
        You have access to a system called Solvent that tracks operational beliefs and the
        actions they authorize.

        Task: determine whether we should deploy etcd v3.5.0 to production. If the current
        evidence supports deployment, authorize it. If it does not, explain what is missing.

        Report what you did and what the system's final state is.
        TXT
      - 'echo "Agent workspace ready - {{.WORKSPACE}}"'
      - 'echo "Contains only solvent-mcp.json and prompt.txt. No repo files."'

  corpus:fetch:
    desc: Capture the canonical etcd issue corpus snapshot from GitHub (reads GitHub once)
    cmds:
      - go run ./cmd/corpus-ingest --fetch corpus-data/etcd-issues.ndjson

  corpus:ingest:
    desc: Load the captured snapshot into the local database (idempotent)
    dotenv:
      - scripts/demo/config.env
    cmds:
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --ingest corpus-data/etcd-issues.ndjson

  corpus:verify:
    desc: Print the corpus and ledger gate counts (read-only)
    dotenv:
      - scripts/demo/config.env
    cmds:
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --verify

  corpus:embed:sample:
    desc: 'Cost/safety gate: embed 20 rows and prove dimensions before spending on 7,239'
    dotenv:
      - scripts/demo/config.env
    cmds:
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --embed --limit 20

  corpus:embed:
    desc: Generate Bedrock Titan embeddings for the corpus (resumable, idempotent)
    dotenv:
      - scripts/demo/config.env
    cmds:
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --embed

  corpus:embed:cloud:
    desc: 'Reconcile the SAME checkpoint vectors into local and cloud (needs FABLE_DSN_2)'
    dotenv:
      - scripts/demo/config.env
    cmds:
      # No second Bedrock call: --also-dsn reconciles both targets from the one
      # checkpoint, which is what makes "both databases hold identical vectors"
      # provable rather than asserted.
      - test -n "$FABLE_DSN_2" || (echo "FABLE_DSN_2 is not set; see scripts/demo/config.env" && exit 1)
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --also-dsn "$FABLE_DSN_2" --embed

  corpus:search:
    desc: 'ANN-search the corpus. Usage: task corpus:search -- "is etcd v3.5.x safe to deploy?"'
    dotenv:
      - scripts/demo/config.env
    cmds:
      - go run ./cmd/corpus-ingest --dsn "$SOLVENT_DSN" --search "{{.CLI_ARGS}}" --explain

  web:run:
    desc: 'Run the judge-facing web app locally (ledger at /, wizard at /demo)'
    dotenv:
      - scripts/demo/config.env
    env:
      FABLE_DSN: '{{.SOLVENT_DSN}}'
    cmds:
      # The web app and the initializer both read FABLE_DSN, not SOLVENT_DSN, and both
      # resolve paths relative to the repo root.
      - 'echo "ledger  http://localhost:${PORT:-8080}/"'
      - 'echo "wizard  http://localhost:${PORT:-8080}/demo"'
      - go run ./demo/cloud/web

  test:
    desc: Run the full verification suite
    cmds:
      - go test -count=1 -p 1 ./...
      - go build ./...
      - go vet ./...
      - test -z "$(gofmt -l cmd internal kernel)" || (echo "gofmt check failed" && exit 1)
      - scripts/check_i7.sh
      # One judge-facing promote path, one authorize path.
      #
      # "The same SQL on both screens" holds because there is a single call site for
      # each, in internal/wizard/refusal.go, reached by both screens with no screen
      # parameter. A second call site is exactly how a screen-dependent branch or a
      # handler-side debt precondition gets in, and either would end the demo's
      # argument.
      #
      # internal/wizard/seed.go is the one permitted exception: it promotes the seeded
      # ANCESTOR as setup, which is not a screen action and is never reached by a
      # request. Nothing else in the package may call either method.
      - |
        for fn in "s.kern.Promote(" "s.kern.IntentOnPromoted("; do
          n=$(grep -cF "$fn" internal/wizard/refusal.go)
          [ "$n" -eq 1 ] || { echo "FAIL: refusal.go has $n call sites for $fn, want exactly 1"; exit 1; }
          stray=$(grep -rlF --include='*.go' --exclude='*_test.go' "$fn" internal/wizard                   | grep -vE 'refusal\.go|seed\.go' || true)
          [ -z "$stray" ] || { echo "FAIL: $fn also called in: $stray"; exit 1; }
        done
        echo "wizard single-call-site: PASS"
      # I-7 MCP boundary — no direct writes in cmd/solvent-mcp or internal/view
      - |
        for d in cmd/solvent-mcp internal/view; do
          [ -d "$d" ] || { echo "FAIL: $d missing"; exit 1; }
        done
        # Stage 1: reject write/transaction entry points
        if grep -rnE --include='*.go' '\.(Exec|ExecContext|Prepare|PrepareContext|Begin|BeginTx)\(' cmd/solvent-mcp internal/view; then
          echo "FAIL: direct write/transaction call in MCP/view"
          exit 1
        fi
        # Stage 2: reject write SQL text (case-insensitive, SQL-shaped)
        if grep -rniE --include='*.go' '(INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[a-z_]+[[:space:]]+SET|DELETE[[:space:]]+FROM|CREATE[[:space:]]+(TABLE|INDEX|DATABASE)|DROP[[:space:]]+(TABLE|INDEX|DATABASE))' cmd/solvent-mcp internal/view; then
          echo "FAIL: write SQL text in MCP/view"
          exit 1
        fi
        echo "I-7 MCP boundary: PASS"
      # The MCP server's own protocol surface, spoken to over stdio.
      #
      # The static greps above prove the MCP layer cannot write; they say nothing about
      # whether it still exposes six working tools. Nothing did, until this script: the
      # "six tools" claim in README.md was a claim about a binary no test had ever
      # spoken JSON-RPC to. It also pins the debt_item guard, which the SDK's schema
      # cannot enforce for us.
      - scripts/mcp_verify.sh
