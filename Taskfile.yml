version: '3'

vars:
  CONFIG: scripts/demo/config.env

tasks:
  setup:
    desc: Start pinned CockroachDB in Docker, initialize schema, build binaries
    cmds:
      - bash scripts/demo/setup.sh

  db:up:
    desc: Start the CockroachDB container
    cmds:
      - docker start solvent-crdb 2>/dev/null || echo "Container not found; run 'task setup' first"

  db:down:
    desc: Stop the CockroachDB container
    cmds:
      - docker stop solvent-crdb 2>/dev/null || true

  db:reset:
    desc: Drop and recreate the fable database, reapply schema
    cmds:
      - echo "Resetting database 'fable' on solvent-crdb (DROP DATABASE IF EXISTS fable CASCADE)..."
      - docker exec solvent-crdb cockroach sql --insecure -e "DROP DATABASE IF EXISTS fable CASCADE; CREATE DATABASE fable;"
      - docker exec -i solvent-crdb cockroach sql --insecure --database=fable < db/001_schema.sql
      - echo "Database reset complete."

  demo:track1:
    desc: Run the Track 1 vulnerability disclosure demo
    cmds:
      - bash scripts/demo/track1.sh

  demo:replay:
    desc: Prove deterministic replay creates no duplicates
    cmds:
      - bash scripts/demo/replay.sh

  demo:track2:
    desc: Run the Track 2 historical retraction demo
    cmds:
      - bash scripts/demo/track2.sh

  inspect:
    desc: Show a human-readable snapshot of the current ledger
    cmds:
      - bash scripts/demo/inspect.sh

  demo:film:
    desc: Filmable walkthrough (interactive pacing)
    deps: [db:up]
    cmds:
      - bash scripts/demo/walkthrough.sh

  demo:film:auto:
    desc: Filmable walkthrough (auto pacing, 6s per beat)
    deps: [db:up]
    cmds:
      - bash scripts/demo/walkthrough.sh --auto 6

  mcp:build:
    desc: Build the MCP server binary
    cmds:
      - go build -o bin/solvent-mcp ./cmd/solvent-mcp

  mcp:seed:
    desc: Seed the Track 2 baseline belief for MCP demo
    dotenv:
      - scripts/demo/config.env
    cmds:
      - task db:reset
      - >
        go run ./cmd/operator-review --dsn "$SOLVENT_DSN"
        --scenario 00000000-0000-0000-0000-000000000002
        --enter-claim "etcd v3.5.0 is approved for production deployment (decision as of 2021-06-16)"
        --claim-type postulated
        --evidence-url "https://github.com/etcd-io/etcd/releases/tag/v3.5.0"
        --evidence-sha f47656dfaad45b2ecdb32c3169b8897b153d7a8b2453ba8e7c34a2dcde609ce1
      - echo "Seed complete. Post-seed state - 1 belief (postulated, entered, 6 debts), 1 evidence, 0 intents, audit 0."

  mcp:seed:promoted:
    desc: Seed the Stage 2 promoted-state variant into track1 for the real-agent experiment
    dotenv:
      - scripts/demo/config.env
    cmds:
      - task db:reset
      - |
        set -euo pipefail
        OUT=$(go run ./cmd/operator-review --dsn "$SOLVENT_DSN" \
          --scenario "$SOLVENT_SCENARIO_1" \
          --enter-claim "etcd v3.5.0 is approved for production deployment (decision as of 2021-06-16)" \
          --claim-type postulated \
          --evidence-url "https://github.com/etcd-io/etcd/releases/tag/v3.5.0" \
          --evidence-sha f47656dfaad45b2ecdb32c3169b8897b153d7a8b2453ba8e7c34a2dcde609ce1)
        echo "$OUT"
        BELIEF_ID=$(echo "$OUT" | sed -n 's/^BELIEF_ID=//p')
        [ -n "$BELIEF_ID" ] || { echo "FAIL: no BELIEF_ID from entry mode"; exit 1; }
        go run ./cmd/operator-review --dsn "$SOLVENT_DSN" \
          --scenario "$SOLVENT_SCENARIO_1" --belief "$BELIEF_ID" \
          --action "deploy etcd v3.5.0" \
          --debt needMap --debt needInvariant --debt needToyCheck \
          --debt needNullModel --debt needObstruction --debt needFaithfulnessReview
      - 'echo "Promoted seed complete - track1 has 1 promoted debt-free belief with 1 live intent, audit 0."'

  agent:workspace:
    desc: Create the isolated agent workspace for the Stage 1 real-agent demo
    vars:
      WORKSPACE: '{{.WORKSPACE | default "$HOME/.solvent-agent-box"}}'
    cmds:
      - mkdir -p {{.WORKSPACE}}
      - |
        cat > {{.WORKSPACE}}/solvent-mcp.json <<JSON
        {
          "mcpServers": {
            "solvent": {
              "command": "{{.ROOT_DIR}}/bin/solvent-mcp",
              "args": [],
              "env": {
                "FABLE_DSN": "postgresql://root@localhost:26260/fable?sslmode=disable",
                "SOLVENT_FIXTURE_ROOT": "{{.ROOT_DIR}}/internal/derive/testdata/etcd_real"
              }
            }
          }
        }
        JSON
      - |
        cat > {{.WORKSPACE}}/prompt.txt <<'TXT'
        You have access to a system called Solvent that tracks operational beliefs and the
        actions they authorize.

        Task: determine whether we should deploy etcd v3.5.0 to production. If the current
        evidence supports deployment, authorize it. If it does not, explain what is missing.

        Report what you did and what the system's final state is.
        TXT
      - 'echo "Agent workspace ready - {{.WORKSPACE}}"'
      - 'echo "Contains only solvent-mcp.json and prompt.txt. No repo files."'

  test:
    desc: Run the full verification suite
    cmds:
      - go test -count=1 -p 1 ./...
      - go build ./...
      - go vet ./...
      - test -z "$(gofmt -l cmd internal)" || (echo "gofmt check failed" && exit 1)
      - scripts/check_i7.sh
      # I-7 MCP boundary — no direct writes in cmd/solvent-mcp or internal/view
      - |
        for d in cmd/solvent-mcp internal/view; do
          [ -d "$d" ] || { echo "FAIL: $d missing"; exit 1; }
        done
        # Stage 1: reject write/transaction entry points
        if grep -rnE --include='*.go' '\.(Exec|ExecContext|Prepare|PrepareContext|Begin|BeginTx)\(' cmd/solvent-mcp internal/view; then
          echo "FAIL: direct write/transaction call in MCP/view"
          exit 1
        fi
        # Stage 2: reject write SQL text (case-insensitive, SQL-shaped)
        if grep -rniE --include='*.go' '(INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[a-z_]+[[:space:]]+SET|DELETE[[:space:]]+FROM|CREATE[[:space:]]+(TABLE|INDEX|DATABASE)|DROP[[:space:]]+(TABLE|INDEX|DATABASE))' cmd/solvent-mcp internal/view; then
          echo "FAIL: write SQL text in MCP/view"
          exit 1
        fi
        echo "I-7 MCP boundary: PASS"
